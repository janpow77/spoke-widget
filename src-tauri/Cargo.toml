[package]
name = "spoke-widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform tray widget for the Spoke-Stack (spoke-agent frontend)"
default-run = "spoke-widget"

[lib]
name = "spoke_widget_lib"
path = "src/lib.rs"

[[bin]]
name = "spoke-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux often needs explicit webkit2gtk for the tauri runtime
# (handled by tauri's transitive deps; no extra crate needed here).

[dev-dependencies]
mockito = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
